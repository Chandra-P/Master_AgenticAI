[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kidspark"
version = "1.0.0"
description = "Real-life decision challenges and personal learning progress"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.40,<2", "pandas>=2.2,<3", "plotly>=5.24,<7"]

[tool.setuptools.packages.find]
where = ["src"]
