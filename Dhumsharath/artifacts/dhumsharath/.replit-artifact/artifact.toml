kind = "web"
previewPath = "/"
title = "Indian Dumb Charades"
version = "1.0.0"
id = "artifacts/dhumsharath"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22639

[services.development]
run = "pnpm --filter @workspace/dhumsharath run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dhumsharath", "run", "build" ]
publicDir = "artifacts/dhumsharath/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22639"
BASE_PATH = "/"
