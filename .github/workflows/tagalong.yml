name: Tagalong checks
on:
  pull_request:
    paths: ['tagalong/**', '.github/workflows/tagalong.yml']
  push:
    paths: ['tagalong/**', '.github/workflows/tagalong.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tagalong
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tagalong/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.12.23'
      - run: uv sync --project backend --frozen --python 3.12
      - run: uv run --project backend pytest backend/tests -q
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --workers=2
      - run: npm run test:shared
      - name: Verify frontend container builds
        run: docker build -t tagalong-web-check .
      - name: Verify backend container builds
        run: docker build -t tagalong-api-check backend
