# Administrator-only deployment settings. Put actual values in Streamlit Cloud Secrets.
# Never commit .streamlit/secrets.toml or real API keys.
CIH_EMBEDDING_PROVIDER = "sentence_transformers"
CIH_EMBEDDING_MODEL = "sentence-transformers/all-MiniLM-L6-v2"
CIH_GENERATION_PROVIDER = "groq"
CIH_GENERATION_MODEL = "qwen/qwen3.8-27b"
CIH_AUTO_INDEX = "true"
GROQ_API_KEY = "replace-in-hosting-secrets-only"
