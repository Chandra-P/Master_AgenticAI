[project]
name = "tagalong-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.121.0",
    "uvicorn==0.38.0",
    "httpx==0.28.1",
    "psycopg[binary,pool]==3.2.12",
    "openai==2.7.1",
    "langgraph==1.0.2",
    "pinecone==7.3.0",
    "mcp>=1.20,<2",
]
[dependency-groups]
dev = ["pytest==8.4.2"]
evaluation = [
    "ragas==0.4.3",
]
[tool.pytest.ini_options]
pythonpath = ["."]
